<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Resumora — AI Resume &amp; Interview Masterclass">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1a2b4a" />
      <stop offset="55%" stop-color="#0a1a3a" />
      <stop offset="100%" stop-color="#05080f" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4e8c1" />
      <stop offset="55%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- gold accent bars (top-left) -->
  <rect x="64" y="64" width="150" height="18" rx="9" fill="#d4af37" />
  <rect x="64" y="96" width="90" height="18" rx="9" fill="#d4af37" />

  <!-- brand wordmark -->
  <text x="600" y="235" text-anchor="middle" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="128" font-weight="800" letter-spacing="8" fill="url(#gold)">RESUMORA</text>

  <!-- tagline -->
  <text x="600" y="345" text-anchor="middle" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#f9f5eb">AI Resume &amp; Interview Masterclass</text>

  <!-- value props -->
  <text x="600" y="415" text-anchor="middle" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="27" fill="#f9f5eb" opacity="0.9">ATS-optimized resumes &#183; Cinematic EN / FR interview prep &#183; Luxury PDFs</text>

  <!-- one-time -->
