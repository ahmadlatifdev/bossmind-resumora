  <text x="600" y="556" text-anchor="middle" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#d4af37">resumora.net</text>

  <rect x="530" y="592" width="140" height="8" rx="4" fill="#d4af37" />
