# Google Cloud Deploy — declarative production pipeline for resumora-live Cloud Run.
# Apply once (or via CI): gcloud deploy apply --file=clouddeploy.yaml --region=us-central1 --project=resumora-live
apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: resumora-production-pipeline
description: Declarative Cloud Run production pipeline for resumora.net (Skaffold + Cloud Deploy)
serialPipeline:
  stages:
    - targetId: production
      profiles: []
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: production
description: Production Cloud Run target (us-central1) — requires human approval before promote
requireApproval: true
run:
  location: projects/resumora-live/locations/us-central1
