# Production Golden Gate — resumora-live / resumora.net
#
# Zero-Failure Deployment: build -> verify -> blue-green channel -> smoke -> promote live.
# Auth: Workload Identity Federation (OIDC) — keyless.
# On failure: diagnose-failure job + optional DEPLOY_ALERT_WEBHOOK notification.

name: Deploy Firebase Hosting Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: hosting-production
  cancel-in-progress: false

permissions:
  contents: read
  checks: write
  id-token: write
  actions: read

env:
  GCP_PROJECT_ID: resumora-live
  GCP_REGION: us-central1
  HOSTING_SITE: client-resumora-live

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deploy config (pre-build)
        run: node scripts/ci/verify-deploy-config.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: cache-nm-root
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-root-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nm-root-${{ runner.os }}-node20-

      - name: Install dependencies
        if: steps.cache-nm-root.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build (Vite)
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_PRICE_BASIC: ${{ secrets.VITE_STRIPE_PRICE_BASIC }}
          VITE_STRIPE_PRICE_BALANCED: ${{ secrets.VITE_STRIPE_PRICE_BALANCED }}
          VITE_STRIPE_PRICE_PROFESSIONAL_TIER: ${{ secrets.VITE_STRIPE_PRICE_PROFESSIONAL_TIER }}
          VITE_STRIPE_PRICE_ADVANCED: ${{ secrets.VITE_STRIPE_PRICE_ADVANCED }}
          VITE_PAYWALL_ALLOW_AUTHED: ${{ secrets.VITE_PAYWALL_ALLOW_AUTHED }}
        run: npm run build

      - name: Verify build output (dist/)
        run: node scripts/ci/verify-deploy-config.mjs

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: hosting-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.pull_request.merged == true)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://resumora.net
    env:
      CHANNEL_ID: prod-candidate-${{ github.run_id }}
      DEPLOY_RETRY_MAX: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Workload Identity secrets are configured
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT_EMAIL: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
        run: |
          if [ -z "$WORKLOAD_IDENTITY_PROVIDER" ] || [ -z "$SERVICE_ACCOUNT_EMAIL" ]; then
            echo "WORKLOAD_IDENTITY_PROVIDER or SERVICE_ACCOUNT_EMAIL GitHub Secret is missing."
            echo "Run scripts/setup-workload-identity.ps1 -SetGitHubSecrets locally once."
            exit 1
          fi
          echo "OIDC auth configured (values not printed)."

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: hosting-dist
          path: dist

      - name: Verify deploy config (pre-deploy)
        run: node scripts/ci/verify-deploy-config.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Cache root + functions node_modules
        id: cache-nm-deploy
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            functions/node_modules
          key: nm-deploy-${{ runner.os }}-node20-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}
          restore-keys: |
            nm-deploy-${{ runner.os }}-node20-

      - name: Install root and functions dependencies
        if: steps.cache-nm-deploy.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm ci --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        # Do not set project_id here — auth@v2 already exports CLOUDSDK_* / GOOGLE_CLOUD_PROJECT.
        # project_id triggers `gcloud config set project`, which refreshes OIDC impersonation
        # tokens and fails with iam.serviceAccounts.getAccessToken denied when WIF IAM is stale.

      - name: Verify GCP credentials (OIDC smoke)
        run: |
          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" || { echo "Missing GOOGLE_APPLICATION_CREDENTIALS"; exit 1; }
          test -f "${GOOGLE_APPLICATION_CREDENTIALS}" || { echo "Credentials file not found"; exit 1; }
          echo "OIDC credentials file present (project=${GCP_PROJECT_ID})"
          gcloud --project="${GCP_PROJECT_ID}" projects describe "${GCP_PROJECT_ID}" --format='value(projectId)'

      - name: Deploy Cloud Functions (with transient retry)
        id: deploy_functions
        run: |
          set -euo pipefail
          deploy_fn() {
            npx firebase-tools@latest deploy --only \
              "functions:resumora-checkout:getSystemHealth,functions:resumora-checkout:runSystemHealth,functions:resumora-checkout:decideSystemHeal,functions:resumora-checkout:updateSystemManual,functions:resumora-checkout:systemManualCron,functions:resumora-checkout:selfHealMonitor,functions:resumora-checkout:stripeWebhook,functions:resumora-checkout:getRefundPreview,functions:resumora-checkout:getRefundPreviewV2,functions:resumora-checkout:cancelSubscription,functions:resumora-checkout:recordServiceEventHttp,functions:resumora-checkout:listRefundsHttp,functions:resumora-checkout:getRevenueAnalytics,functions:resumora-checkout:getChurnPrediction,functions:resumora-checkout:createCheckoutSession,functions:resumora-checkout:videoCatalog,functions:resumora-checkout:videoDownload,functions:resumora-checkout:publishVideoToBilibili" \
              --project "${GCP_PROJECT_ID}" \
              --non-interactive
          }
          attempt=1
          max=2
          while [ "$attempt" -le "$max" ]; do
            if deploy_fn; then
              echo "Functions deploy: Success"
              exit 0
            fi
            log=$(tail -n 40 firebase-debug.log 2>/dev/null || true)
            if echo "$log" | grep -Eiq 'ETIMEDOUT|ECONNRESET|temporarily unavailable|503|429'; then
              echo "Transient error detected — retry $attempt/$max in 15s"
              sleep 15
              attempt=$((attempt + 1))
            else
              echo "Deployment failed due to persistent Cloud Functions error — inspect logs above."
              exit 1
            fi
          done
          echo "Functions deploy failed after $max attempts (transient)."
          exit 1

      - name: Apply Cloud Run IAM bypass (public HTTP services)
        shell: pwsh
        run: |
          foreach ($svc in @(
            'getsystemhealth','runsystemhealth','decidesystemheal','updatesystemmanual',
            'stripewebhook','getrefundpreview','cancelsubscription','recordserviceeventhttp',
            'listrefundshttp','getrefundpreviewv2','getrevenueanalytics','getchurnprediction',
            'createcheckoutsession','videocatalog','videodownload'
          )) {
            Write-Host "Applying --no-invoker-iam-check to: $svc"
            gcloud run services update $svc `
              --project=$env:GCP_PROJECT_ID `
              --region=$env:GCP_REGION `
              --no-invoker-iam-check `
              --quiet
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "gcloud run services update failed for $svc (exit $LASTEXITCODE)"
            }
          }

      - name: Blue-green Hosting (preview channel -> smoke -> live)
        id: blue_green
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        run: node scripts/ci/deploy-hosting-blue-green.mjs

      - name: Capture deploy failure context
        if: failure()
        run: |
          cat > deploy-failure-classification.json <<'JSON'
          {
            "category": "deploy_job_failed",
            "transient": false,
            "message": "See failed step in Actions log. Common: OIDC IAM, functions deploy, smoke test.",
            "nextSteps": "Open diagnose-failure job summary; fix IAM with scripts/setup-workload-identity.ps1 if OIDC; push fix and re-run."
          }
          JSON

      - name: Upload deploy diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-failure-diagnostics
          path: |
            deploy-failure-classification.json
            deploy-smoke-result.json
            firebase-debug.log
          if-no-files-found: ignore

      - name: Regenerate BossMind System Manual
        if: success()
        env:
          ADMIN_REFUND_PASSWORD: ${{ secrets.ADMIN_REFUND_PASSWORD }}
          MANUAL_UPDATE_URL: ${{ secrets.SYSTEM_MANUAL_UPDATE_URL }}
        run: |
          if [ -z "$MANUAL_UPDATE_URL" ] || [ -z "$ADMIN_REFUND_PASSWORD" ]; then
            echo "Manual regeneration skipped (secrets not configured)."
            exit 0
          fi
          curl -sf -X POST "$MANUAL_UPDATE_URL" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Password: $ADMIN_REFUND_PASSWORD" \
            -d "{\"trigger\":\"post_deploy\",\"changelogSynced\":true,\"changelogGitSha\":\"${{ github.sha }}\"}"

  diagnose-failure:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GCP_PROJECT_ID: resumora-live
      HOSTING_SITE: client-resumora-live
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download deploy diagnostics
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: deploy-failure-diagnostics
          path: .

      - name: Authenticate to Google Cloud (rollback)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Node.js (rollback scripts)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Roll back Hosting live channel (if backup exists)
        continue-on-error: true
        run: node scripts/ci/rollback-hosting-live.mjs

      - name: Diagnose failure and write summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_ALERT_WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK }}
        run: node scripts/ci/diagnose-deploy-failure.mjs

      - name: Post diagnosis to GitHub Actions summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Deploy failure (automated diagnosis)\n\n';
            try {
              body += fs.readFileSync('deploy-diagnosis.md', 'utf8');
            } catch (_) {
              body += `Run ${context.runId} failed. Open Actions logs for details.`;
            }
            body += `\n\n[View run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            core.summary.addRaw(body);
            await core.summary.write();

      - name: Upload diagnosis artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnosis
          path: |
            deploy-diagnosis.md
            deploy-rollback-result.json
          if-no-files-found: ignore
