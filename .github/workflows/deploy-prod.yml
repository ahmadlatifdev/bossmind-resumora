# Production Hosting + self-heal Functions — resumora-live / resumora.net
#
# Zero Manual Terminal Deploy: production deploys run ONLY in GitHub Actions after
# Environment `production` approval. Configure in GitHub:
#   Settings → Environments → production → Required reviewers, deployment branches (main), wait timer.
#
# Triggers:
#   - workflow_dispatch (manual, still gated by production environment)
#   - pull_request closed + merged to main (NOT raw push — use branch protection + pre-push hook)
#
# Auth: FIREBASE_SERVICE_ACCOUNT GitHub Secret (never local gcloud/firebase credentials).
# After self-heal function deploy, CI applies --no-invoker-iam-check on HTTP Cloud Run services.
# Never put sk_live_ / whsec_ / pk_live_ / price_ IDs or service-account files in the repo.
name: Deploy Firebase Hosting Production

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: hosting-production
  cancel-in-progress: false

permissions:
  contents: read
  checks: write
  id-token: write

env:
  GCP_PROJECT_ID: resumora-live
  GCP_REGION: us-central1

jobs:
  # Build first (no environment gate) so broken builds never reach approval.
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_PRICE_BASIC: ${{ secrets.VITE_STRIPE_PRICE_BASIC }}
          VITE_STRIPE_PRICE_BALANCED: ${{ secrets.VITE_STRIPE_PRICE_BALANCED }}
          VITE_STRIPE_PRICE_PROFESSIONAL_TIER: ${{ secrets.VITE_STRIPE_PRICE_PROFESSIONAL_TIER }}
          VITE_STRIPE_PRICE_ADVANCED: ${{ secrets.VITE_STRIPE_PRICE_ADVANCED }}
          VITE_PAYWALL_ALLOW_AUTHED: ${{ secrets.VITE_PAYWALL_ALLOW_AUTHED }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: hosting-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  # Manual authorization gate — Required reviewers + wait timer on Environment `production`.
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://resumora.net
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Firebase service account secret is configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT GitHub Secret is missing."
            exit 1
          fi
          echo "FIREBASE_SERVICE_ACCOUNT is configured (value not printed)."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root and functions dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy self-heal Firebase Functions
        run: |
          npx firebase-tools@latest deploy --only \
            "functions:resumora-checkout:getSystemHealth,functions:resumora-checkout:runSystemHealth,functions:resumora-checkout:decideSystemHeal,functions:resumora-checkout:selfHealMonitor" \
            --project "${GCP_PROJECT_ID}" \
            --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Apply Cloud Run IAM bypass (self-heal HTTP services)
        shell: pwsh
        run: |
          foreach ($svc in @('getsystemhealth', 'runsystemhealth', 'decidesystemheal')) {
            Write-Host "Applying --no-invoker-iam-check to Cloud Run service: $svc"
            gcloud run services update $svc `
              --project=$env:GCP_PROJECT_ID `
              --region=$env:GCP_REGION `
              --no-invoker-iam-check `
              --quiet
            if ($LASTEXITCODE -ne 0) {
              throw "gcloud run services update failed for $svc (exit $LASTEXITCODE)"
            }
          }
          Write-Host "IAM bypass applied to getsystemhealth, runsystemhealth, decidesystemheal."
          Write-Host "Skipped selfHealMonitor (Cloud Scheduler job — no public HTTP invoker)." 

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: hosting-dist
          path: dist

      - name: Deploy Hosting live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: resumora-live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
