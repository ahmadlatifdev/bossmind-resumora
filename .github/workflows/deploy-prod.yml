# Production Golden Gate — resumora-live / resumora.net
#
# Zero Manual Terminal Deploy: production deploys run ONLY in GitHub Actions after
# Environment `production` approval (reviewers + wait timer in GitHub Settings).
#
# Triggers: workflow_dispatch OR squash-merge PR into main (not raw push).
# Auth: FIREBASE_SERVICE_ACCOUNT GitHub Secret (never local credentials).
# Post-deploy: regenerates BossMind System Manual when admin secrets are configured.

name: Deploy Firebase Hosting Production

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: hosting-production
  cancel-in-progress: false

permissions:
  contents: read
  checks: write
  id-token: write

env:
  GCP_PROJECT_ID: resumora-live
  GCP_REGION: us-central1

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_PRICE_BASIC: ${{ secrets.VITE_STRIPE_PRICE_BASIC }}
          VITE_STRIPE_PRICE_BALANCED: ${{ secrets.VITE_STRIPE_PRICE_BALANCED }}
          VITE_STRIPE_PRICE_PROFESSIONAL_TIER: ${{ secrets.VITE_STRIPE_PRICE_PROFESSIONAL_TIER }}
          VITE_STRIPE_PRICE_ADVANCED: ${{ secrets.VITE_STRIPE_PRICE_ADVANCED }}
          VITE_PAYWALL_ALLOW_AUTHED: ${{ secrets.VITE_PAYWALL_ALLOW_AUTHED }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: hosting-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://resumora.net
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Firebase service account secret is configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT GitHub Secret is missing."
            exit 1
          fi
          echo "FIREBASE_SERVICE_ACCOUNT is configured (value not printed)."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root and functions dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy self-heal, documentation, and Stripe billing functions
        run: |
          npx firebase-tools@latest deploy --only \
            "functions:resumora-checkout:getSystemHealth,functions:resumora-checkout:runSystemHealth,functions:resumora-checkout:decideSystemHeal,functions:resumora-checkout:updateSystemManual,functions:resumora-checkout:systemManualCron,functions:resumora-checkout:selfHealMonitor,functions:resumora-checkout:stripeWebhook,functions:resumora-checkout:getRefundPreview,functions:resumora-checkout:cancelSubscription,functions:resumora-checkout:recordServiceEventHttp,functions:resumora-checkout:listRefundsHttp,functions:resumora-checkout:createCheckoutSession" \
            --project "${GCP_PROJECT_ID}" \
            --non-interactive

      - name: Apply Cloud Run IAM bypass (public HTTP services)
        shell: pwsh
        run: |
          foreach ($svc in @(
            'getsystemhealth',
            'runsystemhealth',
            'decidesystemheal',
            'updatesystemmanual',
            'stripewebhook',
            'getrefundpreview',
            'cancelsubscription',
            'recordserviceeventhttp',
            'listrefundshttp',
            'createcheckoutsession'
          )) {
            Write-Host "Applying --no-invoker-iam-check to: $svc"
            gcloud run services update $svc `
              --project=$env:GCP_PROJECT_ID `
              --region=$env:GCP_REGION `
              --no-invoker-iam-check `
              --quiet
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "gcloud run services update failed for $svc (exit $LASTEXITCODE) — may not exist yet"
            }
          }
          Write-Host "Skipped selfHealMonitor (scheduler — no public HTTP invoker)."

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: hosting-dist
          path: dist

      - name: Deploy Hosting live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: resumora-live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Regenerate BossMind System Manual
        env:
          ADMIN_REFUND_PASSWORD: ${{ secrets.ADMIN_REFUND_PASSWORD }}
          MANUAL_UPDATE_URL: ${{ secrets.SYSTEM_MANUAL_UPDATE_URL }}
        run: |
          if [ -z "$MANUAL_UPDATE_URL" ] || [ -z "$ADMIN_REFUND_PASSWORD" ]; then
            echo "SYSTEM_MANUAL_UPDATE_URL or ADMIN_REFUND_PASSWORD not set - skip manual regeneration."
            exit 0
          fi
          curl -sf -X POST "$MANUAL_UPDATE_URL" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Password: $ADMIN_REFUND_PASSWORD" \
            -d "{\"trigger\":\"post_deploy\",\"changelogSynced\":true,\"changelogGitSha\":\"${{ github.sha }}\"}"
