# Production Hosting — live channel → client-resumora-live / resumora.net
#
# Approval gate: the `deploy` job targets GitHub Environment `production`.
# Configure Settings → Environments → production → Required reviewers so no
# live Hosting deploy starts until you explicitly Approve in the Actions UI.
# Never put sk_live_ / whsec_ / service-account files in the repo.
name: Deploy Firebase Hosting Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hosting-production
  cancel-in-progress: false

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  # Build first (no environment gate) so broken builds never reach approval.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_PRICE_BASIC: ${{ secrets.VITE_STRIPE_PRICE_BASIC }}
          VITE_STRIPE_PRICE_BALANCED: ${{ secrets.VITE_STRIPE_PRICE_BALANCED }}
          VITE_STRIPE_PRICE_PROFESSIONAL_TIER: ${{ secrets.VITE_STRIPE_PRICE_PROFESSIONAL_TIER }}
          VITE_STRIPE_PRICE_ADVANCED: ${{ secrets.VITE_STRIPE_PRICE_ADVANCED }}
          VITE_PAYWALL_ALLOW_AUTHED: ${{ secrets.VITE_PAYWALL_ALLOW_AUTHED }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: hosting-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  # Manual authorization gate — Required reviewers on Environment `production`.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://resumora.net
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: hosting-dist
          path: dist

      - name: Deploy Hosting live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: resumora-live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
