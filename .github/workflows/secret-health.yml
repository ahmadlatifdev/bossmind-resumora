name: Secret Health Guard

# Verifies Workload Identity Federation secrets for GitHub Actions → GCP.
# FIREBASE_SERVICE_ACCOUNT JSON keys are deprecated (org policy blocked).
# Hosting preview/staging/prod use WORKLOAD_IDENTITY_PROVIDER + SERVICE_ACCOUNT_EMAIL.

on:
  schedule:
    - cron: '0 14 * * *' # daily 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-health
  cancel-in-progress: false

jobs:
  secret-health:
    name: Workload Identity secrets health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check WIF secrets non-empty (no values printed)
        id: check
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT_EMAIL: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
        run: |
          set -euo pipefail
          wip_len=${#WORKLOAD_IDENTITY_PROVIDER}
          sa_len=${#SERVICE_ACCOUNT_EMAIL}
          echo "workload_identity_provider_length_chars=$wip_len" >> "$GITHUB_OUTPUT"
          echo "service_account_email_length_chars=$sa_len" >> "$GITHUB_OUTPUT"
          echo "WORKLOAD_IDENTITY_PROVIDER length: $wip_len (value not printed)"
          echo "SERVICE_ACCOUNT_EMAIL length: $sa_len (value not printed)"
          if [ "$wip_len" -ge 20 ] && [ "$sa_len" -ge 10 ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if WIF secrets missing
        if: steps.check.outputs.status == 'fail'
        env:
          ALERT_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          MSG="WORKLOAD_IDENTITY_PROVIDER and/or SERVICE_ACCOUNT_EMAIL missing in GitHub Actions. Hosting deploys require OIDC. Heal locally with scripts/setup-workload-identity.ps1 -SetGitHubSecrets then re-run deploy."
          echo "::error::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${RESEND_API_KEY:-}" ] && [ -n "${ALERT_TO:-}" ] && [ -n "${ALERT_FROM:-}" ]; then
            payload=$(jq -n \
              --arg to "$ALERT_TO" \
              --arg from "$ALERT_FROM" \
              --arg subject "[resumora-live] Workload Identity secrets health FAILED" \
              --arg html "<p>WIF GitHub secrets are missing. Run local <code>scripts/setup-workload-identity.ps1 -SetGitHubSecrets</code>. No secret values included.</p>" \
              '{from:$from, to:[$to], subject:$subject, html:$html}')
            curl -sS -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer ${RESEND_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              || echo "Email alert send failed (non-blocking for messaging)"
          else
            echo "Email alert skipped (set RESEND_API_KEY, ALERT_EMAIL_TO, ALERT_EMAIL_FROM to enable)."
          fi
          exit 1

      - name: Healthy
        if: steps.check.outputs.status == 'ok'
        run: echo "Workload Identity secrets appear configured. Secret health OK."
