name: Secret Health Guard

# Verifies FIREBASE_SERVICE_ACCOUNT is non-empty in Actions.
# If empty, restores from FIREBASE_SERVICE_ACCOUNT_BACKUP (never from git).
# Requires repo secret SECRET_SYNC_TOKEN (PAT with secrets:write) for auto-restore.
# Fails loudly + optional Resend email when restore is impossible.

on:
  schedule:
    - cron: '0 14 * * *' # daily 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-health
  cancel-in-progress: false

jobs:
  secret-health:
    name: FIREBASE_SERVICE_ACCOUNT health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check primary secret non-empty (no value printed)
        id: check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_BACKUP: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKUP }}
        run: |
          set -euo pipefail
          primary_len=${#FIREBASE_SERVICE_ACCOUNT}
          backup_len=${#FIREBASE_SERVICE_ACCOUNT_BACKUP}
          echo "primary_length_chars=$primary_len" >> "$GITHUB_OUTPUT"
          echo "backup_length_chars=$backup_len" >> "$GITHUB_OUTPUT"
          echo "Primary FIREBASE_SERVICE_ACCOUNT length: $primary_len (value not printed)"
          echo "Backup FIREBASE_SERVICE_ACCOUNT_BACKUP length: $backup_len (value not printed)"
          if [ "$primary_len" -ge 200 ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          elif [ "$backup_len" -ge 200 ]; then
            echo "status=restore" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore primary from backup secret
        if: steps.check.outputs.status == 'restore'
        env:
          SECRET_SYNC_TOKEN: ${{ secrets.SECRET_SYNC_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_BACKUP: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKUP }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET_SYNC_TOKEN:-}" ]; then
            echo "::error::Primary secret empty. Backup exists but SECRET_SYNC_TOKEN is not set (PAT with secrets:write required for auto-restore)."
            echo "Heal locally: powershell -ExecutionPolicy Bypass -File .\\scripts\\bootstrap-secrets.ps1"
            exit 1
          fi
          echo "Restoring FIREBASE_SERVICE_ACCOUNT from BACKUP (value not printed)..."
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BACKUP" | GH_TOKEN="$SECRET_SYNC_TOKEN" gh secret set FIREBASE_SERVICE_ACCOUNT --repo "$GITHUB_REPOSITORY"
          echo "Restore command completed."

      - name: Fail if secret cannot be restored
        if: steps.check.outputs.status == 'fail'
        env:
          ALERT_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          MSG="FIREBASE_SERVICE_ACCOUNT is empty/missing and FIREBASE_SERVICE_ACCOUNT_BACKUP is unavailable. CI Hosting deploys will fail. Heal locally with scripts/bootstrap-secrets.ps1 then re-run deploy-prod."
          echo "::error::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${RESEND_API_KEY:-}" ] && [ -n "${ALERT_TO:-}" ] && [ -n "${ALERT_FROM:-}" ]; then
            payload=$(jq -n \
              --arg to "$ALERT_TO" \
              --arg from "$ALERT_FROM" \
              --arg subject "[resumora-live] FIREBASE_SERVICE_ACCOUNT health FAILED" \
              --arg html "<p>FIREBASE_SERVICE_ACCOUNT is empty in GitHub Actions. Run local <code>scripts/bootstrap-secrets.ps1</code> then re-run deploy-prod. No secret values included.</p>" \
              '{from:$from, to:[$to], subject:$subject, html:$html}')
            curl -sS -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer ${RESEND_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              || echo "Email alert send failed (non-blocking for messaging)"
          else
            echo "Email alert skipped (set RESEND_API_KEY, ALERT_EMAIL_TO, ALERT_EMAIL_FROM to enable)."
          fi
          exit 1

      - name: Healthy
        if: steps.check.outputs.status == 'ok'
        run: echo "FIREBASE_SERVICE_ACCOUNT appears non-empty. Secret health OK."
