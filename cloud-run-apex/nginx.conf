server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Pricing MPA (exact file, not SPA fallback)
  location = /pricing {
    try_files /pricing.html =404;
  }
  location = /pricing/ {
    try_files /pricing.html =404;
  }
  location = /plans {
    try_files /pricing.html =404;
  }

  # Static assets
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA / landing fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
