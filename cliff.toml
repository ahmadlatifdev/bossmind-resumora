# git-cliff ΓÇö BossMind Resumora changelog
# https://git-cliff.org

[changelog]
header = """
# Changelog

All notable changes to **bossmind-resumora** are documented here.
Entries are generated automatically on merge to `main` (see `.github/workflows/auto-changelog.yml`).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased] - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.github.username %} by @{{ commit.github.username }}{%- endif %}\
{% if commit.github.pr_number %} in #{{ commit.github.pr_number }}{%- endif %}
{% endfor %}
{% endfor %}
"""
trim = true
footer = """

---
*Auto-generated by git-cliff. Do not edit manually ΓÇö changes will be overwritten on merge to main.*
"""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^sec", group = "Security" },
  { message = "^security", group = "Security" },
  { message = "^ci", group = "Maintenance" },
  { message = "^chore", group = "Maintenance" },
  { message = "^docs", group = "Maintenance" },
  { message = "^refactor", group = "Maintenance" },
  { message = "^perf", group = "Maintenance" },
  { message = "^test", group = "Maintenance" },
  { message = "^build", group = "Maintenance" },
  { message = ".*", group = "Other" },
]
filter_commits = false
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "ahmadlatifdev"
repo = "bossmind-resumora"
